# RJ Jewellers — one-command build + run.
#
#   docker compose up --build
#
# Env resolution:
#   - Build args (NEXT_PUBLIC_*) are inlined into the browser bundle at build
#     time, so they must be present in the build environment.
#   - Runtime vars are passed into the container via `environment:` below, using
#     ${VAR} interpolation. Locally, Docker Compose auto-loads `.env`; on Dokploy
#     these come from the app's Environment settings (never commit secrets).
#   - `env_file` entries are optional: a fresh clone has neither `.env` nor
#     `.env.local` (both gitignored), and a missing file must not fail the build.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    image: jr-jewellers:latest
    # No host `ports:` publish — on a Dokploy host, port 3000 is already taken by
    # Dokploy's own UI, so binding it fails ("port is already allocated").
    # `expose` makes the container port reachable over the Docker network; Dokploy
    # routes to it via Traefik once you add a Domain (→ service `web`, port 3000)
    # in the app's UI. For local prod testing, add `-p 3000:3000` or a
    # docker-compose.override.yml with a `ports:` mapping.
    # expose:
    #   - "3000"
    environment:
      # Public client config — also read server-side at runtime.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      # Absolute site origin (sitemap / robots / metadataBase / JSON-LD).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      # Server-only secret — read at runtime by lib/db/admin.ts.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      # Transactional email (optional — no key ⇒ email is a no-op).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
    env_file:
      # Optional: local dev may keep values in .env / .env.local. Absent files
      # are ignored (requires Docker Compose v2.24+).
      - path: .env
        required: false
      - path: .env.local
        required: false
    restart: unless-stopped
    healthcheck:
      # Next serves this route once the server is ready; no extra tooling needed.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
